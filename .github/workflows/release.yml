name: Release

# Builds the standalone Windows application and attaches it to a GitHub
# release, so the download link on the site always points at a tested build.
#
# To publish a release, push a version tag from main:
#
#     git tag v2.0.0
#     git push origin v2.0.0
#
# The job runs packaging/build_windows.ps1, which installs the pinned library
# versions, runs the test suite, builds with PyInstaller, smoke-tests the
# executable and zips it as dist/amazeing-app.zip. The zip is then attached to
# the release of that tag, created if it does not exist yet. The download page
# links to releases/latest/download/amazeing-app.zip, so the newest release is
# what people get.
#
# Run by hand from the Actions tab (workflow_dispatch), it builds the zip and
# keeps it as a workflow artifact for a week, without making a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The lock file was made with Python 3.13, the version the application
      # is built and tested with.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build, test and zip the application
        shell: pwsh
        run: .\packaging\build_windows.ps1

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: amazeing-app
          path: dist/amazeing-app.zip
          retention-days: 7

      - name: Attach the zip to the release of this tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist/amazeing-app.zip --clobber
          } else {
            gh release create $env:TAG dist/amazeing-app.zip --title $env:TAG --generate-notes --verify-tag
          }
